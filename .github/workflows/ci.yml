name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - run: npm ci

            # Linux needs a virtual display for VS Code to launch
            - name: Run tests (Linux)
              if: runner.os == 'Linux'
              run: xvfb-run -a npm test

            - name: Run tests (Windows/macOS)
              if: runner.os != 'Linux'
              run: npm test
